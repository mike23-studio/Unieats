<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UniEats – Campus food delivered to your lecture hall</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1 class="logo" onclick="go('menu')">Uni<b>Eats</b></h1>
      <button
        class="loc-pill"
        onclick="openLoc()"
        aria-label="Change delivery location"
      >
        📍 <span id="locLabel">Set location</span> ▾
      </button>
      <nav id="nav"></nav>
    </header>
    <main id="app"></main>
    <div
      class="modal"
      id="locModal"
      onclick="if (event.target === this) closeLoc();"
    >
      <div class="sheet">
        <h2 style="margin-top: 0">Where should we deliver?</h2>
        <label for="locHall">Lecture hall / building</label>
        <select id="locHall"></select>
        <label for="locNote">Extra details (floor, door, landmark)</label>
        <input id="locNote" placeholder="e.g. 2nd floor, near the stairs" />
        <button class="ghost" onclick="useGPS()">
          📡 Use my current location
        </button>
        <p class="muted" id="gpsMsg"></p>
        <div class="row">
          <button class="ghost" onclick="closeLoc()">Cancel</button
          ><button class="p" onclick="saveLoc()">Save location</button>
        </div>
      </div>
    </div>
    <div class="toast" id="toast"></div>
    <script src="app.js"></script>
  </body>
</html>
